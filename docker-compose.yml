# Updated docker-compose.yml with pgadmin and websockets

services:
  backend:
    build: ./backend
    container_name: marketflow_backend
    ports:
      - "8001:8000"
    volumes:
      - ./backend:/var/www/html
    environment:
      - DB_HOST=db
      - DB_PORT=5432
      - DB_NAME=marketplace
      - DB_USER=postgres
      - DB_PASSWORD=postgres
      - PUSHER_APP_ID=${PUSHER_APP_ID}
      - PUSHER_APP_KEY=${PUSHER_APP_KEY}
      - PUSHER_APP_SECRET=${PUSHER_APP_SECRET}
    depends_on:
      - db
  
  frontend:
    build: ./frontend
    container_name: marketflow_frontend
    ports:
      - "3002:3000"
  
  pgadmin4:
    image: dpage/pgadmin4
    container_name: pgadmin
    ports:
      - "5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    environment:
      - PGADMIN_DEFAULT_EMAIL=admin@marketflow
      - PGADMIN_DEFAULT_PASSWORD=admin
  
  ws:
    build: ./backend
    container_name: marketflow_websockets
    ports:
      - "5656:5656"
    command: php artisan websockets:serve
    environment:
      - PUSHER_APP_ID
      - PUSHER_APP_KEY
      - PUSHER_APP_SECRET
    depends_on:
      - backend
  
  db:
    image: postgres:15
    container_name: marketflow_db
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=marketplace

volumes:
  postgres_data:
  pgadmin_data: