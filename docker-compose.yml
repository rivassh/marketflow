# Updated docker-compose.yml with non-conflicting ports
services:
  backend:
    build: ./backend
    container_name: marketflow_backend
    ports:
      - "8001:8000"
    volumes:
      - ./backend:/var/www/html
    environment:
      - DB_HOST=db
      - DB_PORT=5432
      - DB_NAME=marketplace
      - DB_USER=postgres
      - DB_PASSWORD=postgres
    depends_on:
      - db
  
  frontend:
    build: ./frontend
    container_name: marketflow_frontend
    ports:
      - "3000:3000"
  
  db:
    image: postgres:15
    container_name: marketflow_db
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=marketplace

volumes:
  postgres_data: