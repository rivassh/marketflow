version: '3.8'

services:
  backend:
    build: ./backend
    container_name: marketflow_backend
    ports:
      - "8001:8000"
      - "9000:9000"
    volumes:
      - ./backend:/var/www/html
    environment:
      - DB_HOST=db
      - DB_PORT=5432
      - DB_DATABASE=marketplace
      - DB_USERNAME=postgres
      - DB_USER=postgres
      - DB_PASSWORD=postgres
      - DB_CONNECTION=pgsql
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - PUSHER_APP_ID=${PUSHER_APP_ID}
      - PUSHER_APP_KEY=${PUSHER_APP_KEY}
      - PUSHER_APP_SECRET=${PUSHER_APP_SECRET}
      - TOROB_FIXTURE_PATH=/var/www/html/tests/Fixtures/torob_uuid_product.html
    depends_on:
      - db
      - redis
    networks:
      - sail
      - default
  
  frontend:
    build: ./frontend
    container_name: marketflow_frontend
    ports:
      - "3002:3000"
    networks:
      - sail
      - default
    environment:
      - NUXT_PUBLIC_API_BASE=http://localhost:8001/api

  playwright:
    build:
      context: ./e2e
    container_name: marketflow_playwright
    working_dir: /e2e
    depends_on:
      - frontend
      - backend
    networks:
      - sail
      - default
    command: tail -f /dev/null
  
#  pgadmin4:
#    image: dpage/pgadmin4
#    container_name: pgadmin
#    ports:
#      - "5050:80"
#    volumes:
#      - pgadmin_data:/var/lib/pgadmin
#    environment:
#      - PGADMIN_DEFAULT_EMAIL=admin@marketflow
#      - PGADMIN_DEFAULT_PASSWORD=admin
#  
  redis:
    image: redis:latest
    container_name: marketflow_redis
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data
    networks:
      - sail
      - default

  db:
    image: postgres:15
    container_name: marketflow_db
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=marketplace
    networks:
      - sail
      - default

volumes:
  postgres_data:
  redis_data:

networks:
  sail:
    external: true
